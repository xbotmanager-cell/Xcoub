name: Android Release & Debug APK/AAB Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter static analysis
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run Flutter unit tests
        working-directory: flutter_app
        run: flutter test

      - name: Configure optional release keystore signing
        working-directory: flutter_app/android
        env:
          ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
          ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
          ANDROID_KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configuring signed Android release keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
            cat << EOF > key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "SIGNING_MODE=signed" >> $GITHUB_ENV
          else
            echo "No signing secrets configured; falling back cleanly to unsigned/debug signing."
            echo "SIGNING_MODE=unsigned-debug" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Build Android Release App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Verify APK and AAB output files
        working-directory: flutter_app
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK_PATH" || (echo "Missing or empty APK at $APK_PATH" && exit 1)
          test -s "$AAB_PATH" || (echo "Missing or empty AAB at $AAB_PATH" && exit 1)
          echo "Signing mode: $SIGNING_MODE"
          ls -lh "$APK_PATH" "$AAB_PATH"

      - name: Upload app-release.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-master-app-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload app-release.aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-master-app-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create or update GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
