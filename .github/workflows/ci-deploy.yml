name: DRAFT MASTER Web & CI Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  web-engine-and-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript static analysis
        run: npm run lint

      - name: Lint Firestore security rules
        run: npx eslint firestore.rules

      - name: Execute engine and AI unit tests
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Upload production server web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-master-server-web-dist
          path: dist/

  flutter-web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter static analysis
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run Flutter unit tests
        working-directory: flutter_app
        run: flutter test

      - name: Build Flutter Web release
        working-directory: flutter_app
        run: flutter build web --release

      - name: Verify Flutter Web output
        working-directory: flutter_app
        run: |
          test -s build/web/index.html || (echo "Missing build/web/index.html" && exit 1)
          ls -lh build/web/

      - name: Upload Flutter Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-master-flutter-web
          path: flutter_app/build/web/
          if-no-files-found: error

  deploy-firebase-hosting:
    needs: [web-engine-and-server, flutter-web-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: draft-master-flutter-web
          path: flutter_app/build/web/

      - name: Deploy to Firebase Hosting (requires FIREBASE_SERVICE_ACCOUNT secret)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
